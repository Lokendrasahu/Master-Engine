name: "Nexus SaaS: Client Engine"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  deploy-client:
    name: "Deploy & Sync n8n"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==================================================================
      # [PHASE 1]: CHECKOUT & CACHE
      # ==================================================================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Restore n8n Community Node Cache"
        uses: actions/cache@v4
        with:
          path: n8n_data/nodes
          key: nexus-nodes-cache-${{ runner.os }}

      # ==================================================================
      # [PHASE 2]: PRE-FLIGHT
      # ==================================================================
      - name: "🐋 Pre-flight Setup"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -e

          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr

          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 curl jq unzip

          echo "Installing AWS CLI v2..."
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf aws awscliv2.zip

          echo "Pulling required Docker images..."
          docker pull cloudflare/cloudflared:latest
          docker pull n8nio/n8n:latest
          docker pull caddy:latest

          echo "Preparing n8n directories..."
          mkdir -p n8n_data/nodes

          # Restore custom n8n community nodes
          echo "Restoring custom n8n community nodes..."
          aws s3 cp \
            "s3://$BUCKET/$CLIENT_MOBILE/nodes_package.json" \
            "n8n_data/nodes/package.json" \
            --endpoint-url "$R2_ENDPOINT" \
            >/dev/null 2>&1 || true

          cd n8n_data/nodes
          if [ -f package.json ]; then
            echo "Installing saved community nodes..."
            npm install --legacy-peer-deps --no-fund --no-audit
          else
            echo "No custom community nodes to restore."
          fi
          cd ../..

      # ==================================================================
      # [PHASE 3]: STATEFUL HANDOVER
      # ==================================================================
      - name: "🤝 Execute Stateful Handover"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          echo "Scanning for previous deployment state..."

          OLD_RUN=$(gh run list \
            --workflow="main.yml" \
            --json databaseId,status \
            -q '[.[] | select(.databaseId != '${{ github.run_id }}' and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested"))] | .[0]?.databaseId')

          if [ -n "$OLD_RUN" ] && [ "$OLD_RUN" != "null" ]; then
            echo "Previous deployment detected: $OLD_RUN"
            gh run cancel "$OLD_RUN" || true

            echo "Waiting for old runner to release state..."
            for i in {1..36}; do
              STATUS=$(gh run view "$OLD_RUN" --json status -q '.status' 2>/dev/null || echo "completed")

              if [ "$STATUS" != "in_progress" ] &&
                 [ "$STATUS" != "queued" ] &&
                 [ "$STATUS" != "waiting" ] &&
                 [ "$STATUS" != "requested" ]; then
                echo "Previous runner stopped."
                break
              fi

              sleep 5
            done
          else
            echo "No active previous deployment found."
          fi

      # ==================================================================
      # [PHASE 4]: RESTORE n8n STATE FROM R2
      # ==================================================================
      - name: "☁️ Download n8n State from R2"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -e

          echo "Pulling n8n database for client: $CLIENT_MOBILE"

          if aws s3 cp \
            "s3://$BUCKET/$CLIENT_MOBILE/database.sqlite" \
            "n8n_data/database.sqlite" \
            --endpoint-url "$R2_ENDPOINT"; then
            echo "Database restored."
          else
            echo "No existing database found. Starting fresh."
          fi

          sudo chmod -R 777 n8n_data

      # ==================================================================
      # [PHASE 5]: DEPLOYMENT
      # ==================================================================
      - name: "🚀 Start n8n Services"
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          CLIENT_DOMAIN: ${{ secrets.CLIENT_DOMAIN }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          set -e

          docker network create prod-net || true

          # Clean stale containers from this runner, if any.
          docker rm -f n8n caddy cloudflared >/dev/null 2>&1 || true

          cat > Caddyfile <<'EOF'
          :80 {
              reverse_proxy /* n8n:5678
          }
          EOF

          echo "Starting Cloudflare Tunnel..."
          docker run -d \
            --name cloudflared \
            --network host \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run --token "$CF_TOKEN"

          echo "Starting Caddy..."
          docker run -d \
            --name caddy \
            --network prod-net \
            -p 80:80 \
            --restart unless-stopped \
            -v "$(pwd)/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:latest

          echo "Starting n8n..."
          docker run -d \
            --name n8n \
            --network prod-net \
            --restart unless-stopped \
            -v "$(pwd)/n8n_data:/home/node/.n8n" \
            -e NODE_PATH="/home/node/.n8n/nodes/node_modules" \
            -e N8N_ENCRYPTION_KEY="$N8N_ENCRYPTION_KEY" \
            -e N8N_WEBHOOK_URL="https://$CLIENT_DOMAIN" \
            -e GENERIC_TIMEZONE="Asia/Kolkata" \
            -e TZ="Asia/Kolkata" \
            -e NODE_OPTIONS="--max-old-space-size=8192" \
            -e UV_THREADPOOL_SIZE=8 \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            -e N8N_HIDE_USAGE_PAGE=true \
            -e N8N_TEMPLATES_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ONBOARDING_FLOW_DISABLED=true \
            -e N8N_LOG_LEVEL=warn \
            -e N8N_HIRING_BANNER_ENABLED=false \
            -e EXECUTIONS_DATA_PRUNE=true \
            -e EXECUTIONS_DATA_MAX_AGE=24 \
            -e EXECUTIONS_DATA_PRUNE_MAX_COUNT=50 \
            -e EXECUTIONS_DATA_SAVE_ON_SUCCESS=none \
            -e EXECUTIONS_DATA_SAVE_ON_ERROR=all \
            -e EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false \
            -e N8N_WORKFLOW_HISTORY_ENABLED=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -e NODE_FUNCTION_ALLOW_BUILTIN=* \
            -e NODE_FUNCTION_ALLOW_EXTERNAL=* \
            n8nio/n8n:latest

          echo "Waiting for n8n migrations and startup..."
          for i in {1..150}; do
            if docker exec n8n node -e "
              fetch('http://127.0.0.1:5678/healthz')
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1))
            " >/dev/null 2>&1; then
              echo "n8n is healthy."
              break
            fi

            if [ "$i" -eq 150 ]; then
              echo "n8n failed health check after 5 minutes."
              echo "Container status:"
              docker ps -a --filter "name=n8n"
              echo "Last n8n logs:"
              docker logs n8n --tail 150
              exit 1
            fi

            sleep 2
          done

      # ==================================================================
      # [PHASE 6]: R2 BACKUP + KEEP ALIVE
      # ==================================================================
      - name: "🔄 R2 Sync & Keep-Alive Loop"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set +e

          upload_state() {
            echo "Backing up n8n state to R2 ($CLIENT_MOBILE)..."

            if [ -f "n8n_data/database.sqlite" ]; then
              # Checkpoint WAL only. Do NOT VACUUM while n8n is live.
              sqlite3 n8n_data/database.sqlite \
                'PRAGMA wal_checkpoint(TRUNCATE);' \
                >/dev/null 2>&1 || true

              aws s3 cp \
                "n8n_data/database.sqlite" \
                "s3://$BUCKET/$CLIENT_MOBILE/database.sqlite" \
                --endpoint-url "$R2_ENDPOINT" \
                >/dev/null 2>&1 \
                || echo "⚠️ SQLite R2 Sync Failed"
            else
              echo "⚠️ database.sqlite not found; skipping backup."
            fi

            if [ -f "n8n_data/nodes/package.json" ]; then
              aws s3 cp \
                "n8n_data/nodes/package.json" \
                "s3://$BUCKET/$CLIENT_MOBILE/nodes_package.json" \
                --endpoint-url "$R2_ENDPOINT" \
                >/dev/null 2>&1 \
                || echo "⚠️ Community node package R2 Sync Failed"
            fi
          }

          cleanup() {
            [ -f /tmp/sync_lock ] && exit 0
            touch /tmp/sync_lock

            echo "🛑 Shutdown signal received. Securing n8n state..."

            docker stop -t 10 n8n >/dev/null 2>&1 || true
            docker stop -t 10 caddy >/dev/null 2>&1 || true
            docker stop -t 10 cloudflared >/dev/null 2>&1 || true

            # Final backup after n8n is stopped.
            upload_state

            exit 0
          }

          trap 'cleanup' SIGINT SIGTERM SIGHUP

          START=$(date +%s)

          while true; do
            NOW=$(date +%s)
            DIFF=$((NOW - START))

            # Rotate before GitHub's runner limit.
            if [ "$DIFF" -ge 21000 ]; then
              echo "TTL threshold reached. Triggering next runner..."

              gh workflow run main.yml >/dev/null 2>&1 || \
                echo "⚠️ Failed to trigger next runner."

              sleep 30
              cleanup
            fi

            # Restart services if they unexpectedly die.
            if ! docker ps --format '{{.Names}}' | grep -qx n8n; then
              docker restart n8n >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx caddy; then
              docker restart caddy >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx cloudflared; then
              docker restart cloudflared >/dev/null 2>&1 || true
            fi

            # Backup approximately every 15 minutes.
            if [ $((DIFF % 900)) -lt 60 ] && [ "$DIFF" -gt 100 ]; then
              upload_state
              sleep 65
            else
              sleep 5
            fi
          done
