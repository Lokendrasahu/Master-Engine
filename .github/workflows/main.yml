
name: "Nexus SaaS: Client Engine"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nexus-client-engine
  cancel-in-progress: false

jobs:
  deploy-client:
    name: "Deploy, Backup & Rotate n8n"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Community Node Cache
        uses: actions/cache@v4
        with:
          path: n8n_data/nodes
          key: nexus-nodes-cache-${{ runner.os }}

      # ============================================================
      # 2. PRE-FLIGHT
      # ============================================================
      - name: Prepare Runner and R2 Client
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -euo pipefail

          export AWS_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 curl jq unzip

          curl -fsSL \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            -o awscliv2.zip

          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf aws awscliv2.zip

          docker pull cloudflare/cloudflared:latest
          docker pull n8nio/n8n:latest
          docker pull caddy:latest

          mkdir -p n8n_data/nodes

          echo "Checking required configuration..."
          test -n "$R2_ACCOUNT_ID"
          test -n "$BUCKET"
          test -n "$CLIENT_MOBILE"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

          echo "R2 endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Bucket: $BUCKET"
          echo "Client prefix is configured."

          aws --version

          if aws s3 cp \
            "s3://${BUCKET}/${CLIENT_MOBILE}/nodes_package.json" \
            n8n_data/nodes/package.json \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto; then
            echo "Community node package restored."
          else
            echo "No node package restored; continuing without it."
          fi

          if [ -f n8n_data/nodes/package.json ]; then
            cd n8n_data/nodes
            npm install --legacy-peer-deps --no-fund --no-audit
            cd ../..
          fi

      # ============================================================
      # 3. SAFE HANDOVER
      # Never cancel an active runner.
      # ============================================================
      - name: Wait for Previous Deployment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "Checking for an older active deployment..."

          OLD_RUN=$(gh run list \
            --workflow=main.yml \
            --json databaseId,status \
            -q '[.[] | select(.databaseId != '${{ github.run_id }}' and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested"))] | .[0]?.databaseId')

          if [ -n "$OLD_RUN" ] && [ "$OLD_RUN" != "null" ]; then
            echo "Waiting for run $OLD_RUN to finish."
            echo "This workflow will not cancel that run."

            while true; do
              STATUS=$(gh run view "$OLD_RUN" \
                --json status -q '.status' 2>/dev/null || echo unknown)

              if [ "$STATUS" = completed ]; then
                break
              fi

              if [ "$STATUS" = unknown ]; then
                echo "Cannot verify previous run status. Aborting safely."
                exit 1
              fi

              sleep 10
            done

            CONCLUSION=$(gh run view "$OLD_RUN" \
              --json conclusion -q '.conclusion')

            if [ "$CONCLUSION" != success ]; then
              echo "Previous run did not finish successfully."
              echo "Aborting handover to protect the database."
              exit 1
            fi

            echo "Previous deployment completed successfully."
          else
            echo "No previous active deployment."
          fi

      # ============================================================
      # 4. RESTORE DATABASE
      # Never silently create a blank database.
      # ============================================================
      - name: Restore and Validate SQLite Database
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -euo pipefail

          export AWS_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DB_KEY="${CLIENT_MOBILE}/database.sqlite"
          DB_FILE="n8n_data/database.sqlite"

          echo "Checking database object in R2..."

          if ! aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$DB_KEY" \
            --endpoint-url "$ENDPOINT" \
            --region auto >/dev/null; then
            echo "FATAL: Database object is missing or inaccessible."
            echo "Check R2 credentials, endpoint, bucket and object key."
            echo "Refusing to start n8n with an empty database."
            exit 1
          fi

          RESTORED=0

          for attempt in 1 2 3; do
            rm -f "$DB_FILE"

            if aws s3api get-object \
              --bucket "$BUCKET" \
              --key "$DB_KEY" \
              "$DB_FILE" \
              --endpoint-url "$ENDPOINT" \
              --region auto; then

              if [ -s "$DB_FILE" ] &&
                 sqlite3 "$DB_FILE" 'PRAGMA quick_check;' |
                 grep -qx 'ok'; then
                RESTORED=1
                break
              fi

              echo "Database validation failed."
            else
              echo "R2 download failed."
            fi

            echo "Restore attempt ${attempt}/3 failed."
            sleep 10
          done

          if [ "$RESTORED" -ne 1 ]; then
            echo "FATAL: Could not restore a valid database."
            echo "No new n8n instance will be started."
            exit 1
          fi

          chmod -R 777 n8n_data
          echo "Database restore and integrity check passed."

      # ============================================================
      # 5. OPTIONAL LOCAL GEMINI WEB2API
      # Failures here must never fail or stop the existing n8n service.
      # Gemini uses host networking for Gemini upstream compatibility,
      # but binds ONLY to the prod-net bridge gateway IP.
      # No public port, Cloudflare route, or API auth is required.
      # ============================================================
      - name: Start Local Gemini Web2API (Optional)
        continue-on-error: true
        run: |
          set -uo pipefail

          warn() {
            echo "::warning::$1"
          }

          # Create the same private bridge n8n will use later.
          docker network create prod-net >/dev/null 2>&1 || true

          GEMINI_BIND_IP=$(docker network inspect prod-net \
            --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || true)

          if [ -z "$GEMINI_BIND_IP" ]; then
            warn "Gemini skipped: could not determine prod-net gateway. n8n remains running."
            exit 0
          fi

          echo "Gemini API will bind only to $GEMINI_BIND_IP:8081"
          echo "No public interface or public port mapping will be used."

          if ! git clone --depth 1 \
            https://github.com/Sophomoresty/gemini-web2api.git \
            gemini-web2api-source; then
            warn "Gemini source download failed. n8n remains running."
            exit 0
          fi

          mkdir -p gemini_runtime || {
            warn "Could not create Gemini runtime directory. n8n remains running."
            exit 0
          }

          export GEMINI_BIND_IP
          if ! python3 - <<'PYCONFIG'
          import json
          import os

          config = {
              "port": 8081,
              "host": os.environ["GEMINI_BIND_IP"],
              "retry_attempts": 3,
              "retry_delay_sec": 2,
              "request_timeout_sec": 180,
              "gemini_bl": "boq_assistant-bard-web-server_20260716.08_p0",
              "auth_user": None,
              "xsrf_token": None,
              "default_model": "gemini-3.6-flash",
              # Empty list disables proxy auth. The server is bound only
              # to the private Docker bridge gateway, not a public interface.
              "api_keys": [],
              "cookie_file": None,
              "proxy": None,
              "log_requests": False,
              "temporary_chats": True
          }

          with open("gemini_runtime/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
          PYCONFIG
          then
            warn "Gemini config generation failed. n8n remains running."
            exit 0
          fi

          echo "Building Gemini Web2API from source..."
          if ! docker build --pull \
            -t gemini-web2api:local \
            ./gemini-web2api-source; then
            warn "Gemini image build failed. n8n remains running."
            exit 0
          fi

          echo "Starting Gemini API container..."
          if ! docker run -d \
            --name gemini-web2api \
            --network host \
            --restart unless-stopped \
            -v "$(pwd)/gemini_runtime/config.json:/app/config.json:ro" \
            gemini-web2api:local; then
            warn "Gemini container could not start. n8n remains running."
            docker logs gemini-web2api --tail 80 2>/dev/null || true
            exit 0
          fi

          echo "Waiting for local Gemini API..."
          GEMINI_READY=0

          for i in $(seq 1 45); do
            if curl -fsS --connect-timeout 3 --max-time 10 \
              "http://$GEMINI_BIND_IP:8081/v1/models" \
              -o "$RUNNER_TEMP/gemini-models.json"; then
              GEMINI_READY=1
              break
            fi
            sleep 2
          done

          if [ "$GEMINI_READY" -ne 1 ]; then
            warn "Gemini API health check failed. n8n remains running."
            docker logs gemini-web2api --tail 100 2>/dev/null || true
            exit 0
          fi

          echo "Testing one non-streaming Gemini request..."
          GEN_HTTP=$(curl -sS --connect-timeout 10 --max-time 240 \
            -o "$RUNNER_TEMP/gemini-smoke.json" \
            -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"model":"gemini-3.6-flash","stream":false,"messages":[{"role":"user","content":"Reply exactly: LOCAL GEMINI READY"}]}' \
            "http://$GEMINI_BIND_IP:8081/v1/chat/completions" 2>/dev/null || true)

          if [ "$GEN_HTTP" = "200" ]; then
            echo "Gemini generation smoke test: HTTP 200"
            cat "$RUNNER_TEMP/gemini-smoke.json"
          else
            warn "Gemini models endpoint is up, but generation smoke test returned HTTP ${GEN_HTTP:-unknown}. n8n remains running."
            cat "$RUNNER_TEMP/gemini-smoke.json" 2>/dev/null || true
          fi

          echo "LOCAL GEMINI API READY"
          echo "Base URL for n8n: http://host.docker.internal:8081/v1"
          echo "Model: gemini-3.6-flash"
          echo "Proxy authentication: disabled (private Docker bridge binding only)"

      # ============================================================
      # 6. START SERVICES
      # ============================================================
      - name: Start n8n Services
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          CLIENT_DOMAIN: ${{ secrets.CLIENT_DOMAIN }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          test -n "$CF_TOKEN"
          test -n "$CLIENT_DOMAIN"
          test -n "$N8N_ENCRYPTION_KEY"

          docker network create prod-net 2>/dev/null || true

          # Bind the local Gemini API only to the prod-net bridge gateway.
          # This keeps port 8081 off the runner's public interfaces.
          PROD_NET_GW=$(docker network inspect prod-net \
            --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || true)
          if [ -z "$PROD_NET_GW" ]; then
            # Fallback preserves n8n startup; Gemini add-on will skip itself
            # if it cannot determine the concrete prod-net gateway address.
            PROD_NET_GW="host-gateway"
            echo "WARNING: Using Docker host-gateway fallback for n8n."
          else
            echo "Internal Docker gateway: $PROD_NET_GW"
          fi

          docker rm -f n8n caddy cloudflared >/dev/null 2>&1 || true

          cat > Caddyfile <<'EOF'
          :80 {
              reverse_proxy /* n8n:5678
          }
          EOF

          docker run -d \
            --name cloudflared \
            --network host \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run --token "$CF_TOKEN"

          docker run -d \
            --name caddy \
            --network prod-net \
            -p 80:80 \
            --restart unless-stopped \
            -v "$(pwd)/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:latest

          docker run -d \
            --name n8n \
            --network prod-net \
            --add-host "host.docker.internal:$PROD_NET_GW" \
            --restart unless-stopped \
            -v "$(pwd)/n8n_data:/home/node/.n8n" \
            -e NODE_PATH="/home/node/.n8n/nodes/node_modules" \
            -e N8N_ENCRYPTION_KEY="$N8N_ENCRYPTION_KEY" \
            -e N8N_WEBHOOK_URL="https://$CLIENT_DOMAIN" \
            -e GENERIC_TIMEZONE="Asia/Kolkata" \
            -e TZ="Asia/Kolkata" \
            -e NODE_OPTIONS="--max-old-space-size=8192" \
            -e UV_THREADPOOL_SIZE=8 \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            -e N8N_HIDE_USAGE_PAGE=false \
            -e N8N_TEMPLATES_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ONBOARDING_FLOW_DISABLED=true \
            -e N8N_LOG_LEVEL=warn \
            -e N8N_HIDE_PRODUCTION_CHECKLIST=true \
            -e N8N_HIRING_BANNER_ENABLED=false \
            -e EXECUTIONS_DATA_PRUNE=true \
            -e EXECUTIONS_DATA_MAX_AGE=24 \
            -e EXECUTIONS_DATA_PRUNE_MAX_COUNT=50 \
            -e EXECUTIONS_DATA_SAVE_ON_SUCCESS=none \
            -e EXECUTIONS_DATA_SAVE_ON_ERROR=all \
            -e EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false \
            -e N8N_WORKFLOW_HISTORY_ENABLED=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -e NODE_FUNCTION_ALLOW_BUILTIN=* \
            -e NODE_FUNCTION_ALLOW_EXTERNAL=* \
            n8nio/n8n:latest

          echo "Waiting for n8n health..."

          HEALTHY=0
          for i in {1..150}; do
            if docker exec n8n node -e "
              fetch('http://127.0.0.1:5678/healthz')
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1))
            " >/dev/null 2>&1; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker ps -a
            docker logs n8n --tail 150
            exit 1
          fi

          echo "n8n is healthy."

      # ============================================================
      # 7. VERIFY LOCAL GEMINI FROM N8N (NON-FATAL)
      # ============================================================
      - name: Verify n8n to Gemini Local Connection
        continue-on-error: true
        run: |
          set -u

          if ! docker inspect gemini-web2api >/dev/null 2>&1; then
            echo "::warning::Gemini container is unavailable; n8n remains healthy."
            exit 0
          fi

          if docker exec n8n node -e '
          fetch("http://host.docker.internal:8081/v1/models")
            .then(async (r) => {
              const body = await r.text();
              if (!r.ok) {
                console.error("Gemini returned HTTP", r.status, body.slice(0, 500));
                process.exit(1);
              }
              console.log("n8n can reach local Gemini API: HTTP", r.status);
            })
            .catch((e) => {
              console.error("n8n-to-Gemini connection failed:", e.message);
              process.exit(1);
            });
          '; then
            echo "n8n-to-Gemini local connection verified."
          else
            echo "::warning::Gemini local connection test failed. Existing n8n service remains running."
            docker logs gemini-web2api --tail 60 2>/dev/null || true
          fi

      # ============================================================
      # 8. VERIFIED BACKUP + ROTATION
      # ============================================================
      - name: Backup State and Keep Alive
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -uo pipefail

          export AWS_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DB_KEY="${CLIENT_MOBILE}/database.sqlite"

          upload_state() {
            echo "Backing up SQLite database..."

            if [ ! -s n8n_data/database.sqlite ]; then
              echo "ERROR: Local database missing or empty."
              return 1
            fi

            if ! sqlite3 n8n_data/database.sqlite \
              'PRAGMA wal_checkpoint(TRUNCATE);' >/dev/null 2>&1; then
              echo "WARNING: WAL checkpoint did not complete."
            fi

            if ! sqlite3 n8n_data/database.sqlite \
              'PRAGMA quick_check;' | grep -qx 'ok'; then
              echo "ERROR: Local database integrity check failed."
              return 1
            fi

            LOCAL_SIZE=$(stat -c %s n8n_data/database.sqlite)

            if ! aws s3 cp \
              n8n_data/database.sqlite \
              "s3://${BUCKET}/${DB_KEY}" \
              --endpoint-url "$ENDPOINT" \
              --region auto; then
              echo "ERROR: Database upload failed."
              return 1
            fi

            REMOTE_SIZE=$(aws s3api head-object \
              --bucket "$BUCKET" \
              --key "$DB_KEY" \
              --endpoint-url "$ENDPOINT" \
              --region auto \
              --query ContentLength \
              --output text 2>/dev/null || echo 0)

            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "ERROR: Remote size verification failed."
              echo "Local: $LOCAL_SIZE; R2: $REMOTE_SIZE"
              return 1
            fi

            echo "Database backup verified: ${REMOTE_SIZE} bytes."

            if [ -f n8n_data/nodes/package.json ]; then
              aws s3 cp \
                n8n_data/nodes/package.json \
                "s3://${BUCKET}/${CLIENT_MOBILE}/nodes_package.json" \
                --endpoint-url "$ENDPOINT" \
                --region auto \
                || echo "WARNING: Community node package upload failed."
            fi

            return 0
          }

          cleanup() {
            echo "Stopping services for final backup..."

            docker stop -t 20 n8n >/dev/null 2>&1 || true
            docker stop -t 10 gemini-web2api >/dev/null 2>&1 || true
            docker stop -t 10 caddy >/dev/null 2>&1 || true
            docker stop -t 10 cloudflared >/dev/null 2>&1 || true

            for attempt in 1 2 3 4 5; do
              if upload_state; then
                echo "Final database backup verified."
                return 0
              fi

              echo "Final backup retry ${attempt}/5."
              sleep 15
            done

            echo "FATAL: Final backup could not be verified."
            return 1
          }

          START=$(date +%s)
          ROTATE_AFTER=19800
          LAST_BACKUP=0
          BACKUP_INTERVAL=900
          LAST_METRICS=0
          METRICS_INTERVAL=60

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))

            # Lightweight host + per-container resource report every minute.
            if [ "$((NOW - LAST_METRICS))" -ge "$METRICS_INTERVAL" ]; then
              echo ""
              echo "========== RUNNER RESOURCE REPORT =========="
              date -u '+UTC: %Y-%m-%d %H:%M:%S'
              echo "Logical CPU cores: $(nproc 2>/dev/null || echo unknown)"
              echo "Load average: $(cat /proc/loadavg 2>/dev/null || echo unavailable)"
              echo "Host memory:"
              free -h 2>/dev/null || true
              echo "Root disk:"
              df -h / 2>/dev/null | tail -n 1 || true
              echo "Container CPU / RAM / network / disk I/O:"
              docker stats --no-stream \
                --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}' \
                2>/dev/null || true
              echo "============================================="
              LAST_METRICS=$NOW
            fi

            # 5 hours 30 minutes: trigger successor before hard limit.
            if [ "$ELAPSED" -ge "$ROTATE_AFTER" ]; then
              echo "Rotation threshold reached."

              if ! gh workflow run main.yml; then
                echo "ERROR: Could not queue the next runner."
                echo "Keeping this runner alive and retrying."
                sleep 60
                continue
              fi

              echo "Next run queued. Performing final backup..."

              if cleanup; then
                echo "Verified handover backup complete."
                exit 0
              else
                exit 1
              fi
            fi

            # Detect unexpected container exits.
            if ! docker ps --format '{{.Names}}' | grep -qx n8n; then
              echo "WARNING: n8n stopped; attempting restart."
              docker start n8n >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx caddy; then
              docker start caddy >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx cloudflared; then
              docker start cloudflared >/dev/null 2>&1 || true
            fi

            # Gemini is an optional add-on: restart it if its container exists.
            if docker inspect gemini-web2api >/dev/null 2>&1; then
              if ! docker ps --format '{{.Names}}' | grep -qx gemini-web2api; then
                echo "WARNING: Gemini proxy stopped; attempting restart."
                docker start gemini-web2api >/dev/null 2>&1 || true
              fi
            fi

            # Periodic backup every 15 minutes.
            if [ "$((NOW - LAST_BACKUP))" -ge "$BACKUP_INTERVAL" ]; then
              if upload_state; then
                LAST_BACKUP=$NOW
              else
                echo "WARNING: Periodic backup failed; will retry."
              fi
            fi

            sleep 10
          done
