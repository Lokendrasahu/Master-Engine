
name: "Nexus SaaS: Client Engine"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  deploy-client:
    name: "Deploy & Sync n8n"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ================================================================
      # PHASE 1: CHECKOUT AND CACHE
      # ================================================================
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Restore Community Node Cache"
        uses: actions/cache@v4
        with:
          path: n8n_data/nodes
          key: nexus-nodes-cache-${{ runner.os }}

      # ================================================================
      # PHASE 2: PRE-FLIGHT
      # ================================================================
      - name: "Pre-flight Setup"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -euo pipefail

          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true

          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 curl jq unzip

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf aws awscliv2.zip

          docker pull cloudflare/cloudflared:latest
          docker pull n8nio/n8n:latest
          docker pull caddy:latest

          mkdir -p n8n_data/nodes

          echo "Restoring community node package..."
          aws s3 cp \
            "s3://$BUCKET/$CLIENT_MOBILE/nodes_package.json" \
            "n8n_data/nodes/package.json" \
            --endpoint-url "$R2_ENDPOINT" \
            >/dev/null 2>&1 || true

          if [ -f n8n_data/nodes/package.json ]; then
            cd n8n_data/nodes
            npm install --legacy-peer-deps --no-fund --no-audit
            cd ../..
          fi

      # ================================================================
      # PHASE 3: SAFE HANDOVER
      # Never cancel the old runner to make room for the new one.
      # ================================================================
      - name: "Safe Stateful Handover"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "Looking for an older active deployment..."

          OLD_RUN=$(gh run list \
            --workflow="main.yml" \
            --json databaseId,status \
            -q '[.[] | select(.databaseId != '${{ github.run_id }}' and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested"))] | .[0]?.databaseId')

          if [ -n "$OLD_RUN" ] && [ "$OLD_RUN" != "null" ]; then
            echo "Previous run: $OLD_RUN"
            echo "Waiting for the old runner to stop after its final backup."
            echo "The old runner will NOT be cancelled by this workflow."

            while true; do
              STATUS=$(gh run view "$OLD_RUN" \
                --json status -q '.status' 2>/dev/null || echo "unknown")

              case "$STATUS" in
                completed)
                  break
                  ;;
                *)
                  sleep 10
                  ;;
              esac
            done

            CONCLUSION=$(gh run view "$OLD_RUN" \
              --json conclusion -q '.conclusion' 2>/dev/null || echo "unknown")

            if [ "$CONCLUSION" != "success" ]; then
              echo "ERROR: Previous run ended as '$CONCLUSION'."
              echo "Safe handover refused because final backup is unconfirmed."
              exit 1
            fi

            echo "Previous runner completed successfully."
          else
            echo "No older active run found."
          fi

      # ================================================================
      # PHASE 4: RESTORE AND VALIDATE DATABASE
      # Never silently create a blank database.
      # ================================================================
      - name: "Restore n8n Database from R2"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -euo pipefail

          DB_KEY="$CLIENT_MOBILE/database.sqlite"
          DB_URL="s3://$BUCKET/$DB_KEY"

          echo "Checking R2 database object..."

          if ! aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$DB_KEY" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null; then
            echo "FATAL: R2 database is missing or inaccessible."
            echo "Refusing to launch n8n with an empty database."
            exit 1
          fi

          RESTORED=0

          for attempt in 1 2 3; do
            rm -f n8n_data/database.sqlite

            if aws s3 cp "$DB_URL" \
              n8n_data/database.sqlite \
              --endpoint-url "$R2_ENDPOINT"; then

              if [ -s n8n_data/database.sqlite ] &&
                 sqlite3 n8n_data/database.sqlite \
                   'PRAGMA quick_check;' | grep -qx 'ok'; then
                RESTORED=1
                break
              fi

              echo "Downloaded database failed integrity validation."
            fi

            echo "Restore attempt $attempt/3 failed; retrying..."
            sleep 10
          done

          if [ "$RESTORED" -ne 1 ]; then
            echo "FATAL: Could not restore a valid SQLite database."
            exit 1
          fi

          echo "Database restored and validated."
          sudo chmod -R 777 n8n_data

      # ================================================================
      # PHASE 5: START SERVICES
      # ================================================================
      - name: "Start n8n Services"
        env:
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          CLIENT_DOMAIN: ${{ secrets.CLIENT_DOMAIN }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          docker network create prod-net || true
          docker rm -f n8n caddy cloudflared >/dev/null 2>&1 || true

          cat > Caddyfile <<'EOF'
          :80 {
              reverse_proxy /* n8n:5678
          }
          EOF

          docker run -d \
            --name cloudflared \
            --network host \
            --restart unless-stopped \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run --token "$CF_TOKEN"

          docker run -d \
            --name caddy \
            --network prod-net \
            -p 80:80 \
            --restart unless-stopped \
            -v "$(pwd)/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:latest

          docker run -d \
            --name n8n \
            --network prod-net \
            --restart unless-stopped \
            -v "$(pwd)/n8n_data:/home/node/.n8n" \
            -e NODE_PATH="/home/node/.n8n/nodes/node_modules" \
            -e N8N_ENCRYPTION_KEY="$N8N_ENCRYPTION_KEY" \
            -e N8N_WEBHOOK_URL="https://$CLIENT_DOMAIN" \
            -e GENERIC_TIMEZONE="Asia/Kolkata" \
            -e TZ="Asia/Kolkata" \
            -e NODE_OPTIONS="--max-old-space-size=8192" \
            -e UV_THREADPOOL_SIZE=8 \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            -e N8N_HIDE_USAGE_PAGE=false \
            -e N8N_TEMPLATES_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ONBOARDING_FLOW_DISABLED=true \
            -e N8N_LOG_LEVEL=warn \
            -e N8N_HIDE_PRODUCTION_CHECKLIST=true \
            -e N8N_HIRING_BANNER_ENABLED=false \
            -e EXECUTIONS_DATA_PRUNE=true \
            -e EXECUTIONS_DATA_MAX_AGE=24 \
            -e EXECUTIONS_DATA_PRUNE_MAX_COUNT=50 \
            -e EXECUTIONS_DATA_SAVE_ON_SUCCESS=none \
            -e EXECUTIONS_DATA_SAVE_ON_ERROR=all \
            -e EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false \
            -e N8N_WORKFLOW_HISTORY_ENABLED=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -e NODE_FUNCTION_ALLOW_BUILTIN=* \
            -e NODE_FUNCTION_ALLOW_EXTERNAL=* \
            n8nio/n8n:latest

          echo "Waiting for n8n health check..."

          HEALTHY=0

          for i in {1..150}; do
            if docker exec n8n node -e "
              fetch('http://127.0.0.1:5678/healthz')
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1))
            " >/dev/null 2>&1; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker ps -a
            docker logs n8n --tail 150
            exit 1
          fi

          echo "n8n is healthy."

      # ================================================================
      # PHASE 6: VERIFIED R2 BACKUP + RUNNER ROTATION
      # ================================================================
      - name: "R2 Sync and Keep Alive"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLIENT_MOBILE: ${{ secrets.CLIENT_MOBILE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -uo pipefail

          upload_state() {
            echo "Starting SQLite backup to R2..."

            if [ ! -s n8n_data/database.sqlite ]; then
              echo "ERROR: Local database is missing or empty."
              return 1
            fi

            # Checkpoint WAL before copying the SQLite database.
            sqlite3 n8n_data/database.sqlite \
              'PRAGMA wal_checkpoint(TRUNCATE);' >/dev/null 2>&1 || true

            if ! sqlite3 n8n_data/database.sqlite \
              'PRAGMA quick_check;' | grep -qx 'ok'; then
              echo "ERROR: SQLite integrity check failed; backup refused."
              return 1
            fi

            LOCAL_SIZE=$(stat -c %s n8n_data/database.sqlite 2>/dev/null || echo 0)

            if [ "$LOCAL_SIZE" -le 0 ]; then
              echo "ERROR: Local database size is zero."
              return 1
            fi

            if ! aws s3 cp \
              n8n_data/database.sqlite \
              "s3://$BUCKET/$CLIENT_MOBILE/database.sqlite" \
              --endpoint-url "$R2_ENDPOINT"; then
              echo "ERROR: Upload to R2 failed."
              return 1
            fi

            REMOTE_SIZE=$(aws s3api head-object \
              --bucket "$BUCKET" \
              --key "$CLIENT_MOBILE/database.sqlite" \
              --endpoint-url "$R2_ENDPOINT" \
              --query ContentLength \
              --output text 2>/dev/null || echo 0)

            if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
              echo "ERROR: Size verification failed."
              echo "Local=$LOCAL_SIZE bytes; R2=$REMOTE_SIZE bytes."
              return 1
            fi

            echo "SUCCESS: R2 database size verified: $REMOTE_SIZE bytes."

            if [ -f n8n_data/nodes/package.json ]; then
              aws s3 cp \
                n8n_data/nodes/package.json \
                "s3://$BUCKET/$CLIENT_MOBILE/nodes_package.json" \
                --endpoint-url "$R2_ENDPOINT" \
                || echo "WARNING: Community node package backup failed."
            fi

            return 0
          }

          cleanup() {
            if [ "${CLEANUP_STARTED:-0}" = "1" ]; then
              return
            fi
            CLEANUP_STARTED=1
            trap - SIGINT SIGTERM SIGHUP

            echo "Stopping services for safe handover..."

            docker stop -t 20 n8n >/dev/null 2>&1 || true
            docker stop -t 10 caddy >/dev/null 2>&1 || true
            docker stop -t 10 cloudflared >/dev/null 2>&1 || true

            BACKUP_OK=0

            for attempt in 1 2 3 4 5; do
              if upload_state; then
                BACKUP_OK=1
                break
              fi

              echo "Final backup attempt $attempt/5 failed."
              sleep 15
            done

            if [ "$BACKUP_OK" -ne 1 ]; then
              echo "FATAL: Final R2 backup could not be verified."
              return 1
            fi

            echo "Final R2 backup verified."
            return 0
          }

          trap 'cleanup || exit 1' SIGINT SIGTERM SIGHUP

          START=$(date +%s)
          ROTATE_AFTER=19800
          LAST_BACKUP=0
          BACKUP_INTERVAL=900

          while true; do
            NOW=$(date +%s)
            DIFF=$((NOW - START))

            # Rotate at 5h30m, before GitHub's 6-hour hard limit.
            if [ "$DIFF" -ge "$ROTATE_AFTER" ]; then
              echo "Rotation threshold reached."

              if ! gh workflow run main.yml; then
                echo "ERROR: Could not queue the next runner."
                echo "Keeping the current runner alive and retrying."
                sleep 60
                continue
              fi

              echo "Next runner queued; preparing final verified backup."

              if cleanup; then
                echo "Safe shutdown finished."
                exit 0
              else
                echo "ERROR: Final backup failed. This run will fail."
                exit 1
              fi
            fi

            # Restart crashed containers if Docker still reports them.
            if ! docker ps --format '{{.Names}}' | grep -qx n8n; then
              echo "WARNING: n8n container stopped; attempting restart."
              docker restart n8n >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx caddy; then
              docker restart caddy >/dev/null 2>&1 || true
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx cloudflared; then
              docker restart cloudflared >/dev/null 2>&1 || true
            fi

            # Backup every 15 minutes.
            if [ "$((NOW - LAST_BACKUP))" -ge "$BACKUP_INTERVAL" ]; then
              if upload_state; then
                LAST_BACKUP=$NOW
              else
                echo "WARNING: Periodic backup failed; retrying next loop."
              fi
            fi

            sleep 10
          done
