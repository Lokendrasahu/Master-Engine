
name: R2 Database Recovery

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y awscli

      - name: List and download database
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT: ${{ secrets.CLIENT_MOBILE }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "$CLIENT/" \
            --endpoint-url "$ENDPOINT" \
            --query 'Contents[].{Key:Key,Size:Size,Modified:LastModified}' \
            --output table

          aws s3 cp \
            "s3://${BUCKET}/${CLIENT}/database.sqlite" \
            recovered-database.sqlite \
            --endpoint-url "$ENDPOINT"

          ls -lh recovered-database.sqlite
          sha256sum recovered-database.sqlite

      - name: Save recovery file
        uses: actions/upload-artifact@v4
        with:
          name: n8n-database-recovery
          path: recovered-database.sqlite
          retention-days: 7
