
name: R2 Database Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install AWS CLI v2
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y curl unzip jq
          curl -sS \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Inspect R2 database and incomplete uploads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          CLIENT: ${{ secrets.CLIENT_MOBILE }}
        shell: bash
        run: |
          set -euo pipefail

          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="${CLIENT}/database.sqlite"

          echo "=== 1. Check current database object ==="

          if aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --endpoint-url "$ENDPOINT" \
            --query '{Size:ContentLength,Modified:LastModified,ETag:ETag}' \
            --output json; then
            echo "Database object exists."
          else
            echo "Current database object not accessible."
          fi

          echo "=== 2. List client objects ==="

          aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "${CLIENT}/" \
            --endpoint-url "$ENDPOINT" \
            --query 'Contents[].{Key:Key,Size:Size,Modified:LastModified}' \
            --output json || true

          echo "=== 3. Find incomplete multipart uploads ==="

          aws s3api list-multipart-uploads \
            --bucket "$BUCKET" \
            --prefix "${CLIENT}/" \
            --endpoint-url "$ENDPOINT" \
            --output json > multipart.json

          jq --arg key "$KEY" \
            '[.Uploads[]? | select(.Key == $key)]' \
            multipart.json > matching.json

          COUNT=$(jq 'length' matching.json)
          echo "Matching uploads: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No incomplete upload found for database.sqlite."
          else
            for i in $(seq 0 $((COUNT - 1))); do
              UPLOAD_ID=$(jq -r ".[$i].UploadId" matching.json)

              echo "=== Upload $((i + 1)) ==="
              jq ".[$i] | {Key, UploadId, Initiated}" matching.json

              aws s3api list-parts \
                --bucket "$BUCKET" \
                --key "$KEY" \
                --upload-id "$UPLOAD_ID" \
                --endpoint-url "$ENDPOINT" \
                --query 'Parts[].{PartNumber:PartNumber,Size:Size,ETag:ETag}' \
                --output json
            done
          fi

          echo "=== Inspection complete; no objects modified. ==="
